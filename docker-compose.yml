services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docmanager
      POSTGRES_USER: docmanager
      POSTGRES_PASSWORD: docmanager
    ports:
      - "5432:5432"
    volumes:
      - docmanager-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: docmanager
      DB_USER: docmanager
      DB_PASSWORD: docmanager
    ports:
      - "8080:8080"

volumes:
  docmanager-db-data:

